services:
  postgres:
    # pgvector/pgvector ships Postgres + the `vector` extension pre-installed —
    # needed by the chatbot feature's KnowledgeChunk.embedding column. Using
    # plain `postgres:18` would make the `CREATE EXTENSION vector` migration fail.
    image: pgvector/pgvector:pg18
    container_name: ecommerce_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      # Postgres 18's official image changed its expected layout: it now wants
      # ONE mount at /var/lib/postgresql (it manages a versioned subdirectory
      # itself) rather than a mount directly at .../data — mounting at .../data
      # makes the entrypoint refuse to start ("unused mount/volume" error).
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ecommerce}"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: ecommerce_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@purelioraa.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    container_name: ecommerce_redis
    restart: unless-stopped
    ports:
      # Host-side port only — bumped off the default 6379 because another
      # container on this machine already holds it. Containers still reach
      # Redis on its normal internal port via the `redis` hostname (see
      # backend's REDIS_URL below), so nothing else needs to change.
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    container_name: ecommerce_backend
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-ecommerce}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      REDIS_URL: redis://redis:6379/0
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Single-line on purpose: a YAML folded (`>`) scalar with visually-indented
    # continuation lines does NOT fold those lines into spaces (YAML preserves
    # literal newlines for "more indented" content). That silently split this
    # into multiple shell commands and dropped `--bind`, `--access-logfile` etc,
    # leaving gunicorn on its default 127.0.0.1:8000 — unreachable from outside
    # the container despite the published port.
    command: sh -c "alembic upgrade head && gunicorn app.main:app --workers 4 --worker-class uvicorn.workers.UvicornWorker --bind 0.0.0.0:8000 --no-control-socket --access-logfile - --error-logfile -"

volumes:
  postgres_data:
  pgadmin_data:
